name: Slice Alibaba GPU trace

on:
  workflow_dispatch:
    inputs:
      day:
        description: "Trace day (0..184)"
        required: true
        default: "0"
        type: string
      hour:
        description: "Trace hour (0..23)"
        required: true
        default: "0"
        type: string
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  slice:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == github.repository_owner && startsWith(github.event.issue.title, 'slice d'))
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install slicer dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Resolve requested slice
        id: slice
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_DAY: ${{ inputs.day }}
          DISPATCH_HOUR: ${{ inputs.hour }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            day=$((10#$DISPATCH_DAY))
            hour=$((10#$DISPATCH_HOUR))
          else
            if [[ ! "$ISSUE_TITLE" =~ ^slice[[:space:]]d([0-9]{3})h([0-9]{2})$ ]]; then
              echo "Issue title must be exactly: slice dDDDhHH" >&2
              exit 2
            fi
            day=$((10#${BASH_REMATCH[1]}))
            hour=$((10#${BASH_REMATCH[2]}))
          fi
          if (( day < 0 || day > 184 || hour < 0 || hour > 23 )); then
            echo "Invalid slice day=$day hour=$hour" >&2
            exit 2
          fi
          printf 'day=%d\n' "$day" >> "$GITHUB_OUTPUT"
          printf 'hour=%d\n' "$hour" >> "$GITHUB_OUTPUT"
          printf 'id=d%03dh%02d\n' "$day" "$hour" >> "$GITHUB_OUTPUT"

      - name: Range-extract pod and server Parquet
        working-directory: cluster-trace-gpu-v2026/tools
        run: |
          python slice_hour.py \
            --day '${{ steps.slice.outputs.day }}' \
            --hour '${{ steps.slice.outputs.hour }}' \
            --out '${{ github.workspace }}/slice-output'

      - name: Show proof of bounded Range transfer
        shell: bash
        run: |
          cat 'slice-output/manifest_${{ steps.slice.outputs.id }}.json'
          du -h slice-output/*

      - name: Upload numbered slice
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: alibaba-${{ steps.slice.outputs.id }}
          path: slice-output/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Close command issue on success
        if: github.event_name == 'issues' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          SLICE_ID: ${{ steps.slice.outputs.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --body "Slice **$SLICE_ID** completed. Artifact: **alibaba-$SLICE_ID**. Run: $RUN_URL"
          gh issue close "$ISSUE"
